[build-system]
requires = ["setuptools>=69"]
build-backend = "setuptools.build_meta"

[project]
name = "kifu"
version = "0.1.0"
description = "Find the ideas you left behind in your Claude Code sessions: loose ends, where each idea moved, and how you work."
readme = "README.md"
license = "MIT"
authors = [{ name = "Taro" }]
requires-python = ">=3.11"
keywords = ["claude-code", "claude", "developer-tools", "llm", "productivity", "sessions"]
classifiers = [
  "Development Status :: 4 - Beta",
  "Environment :: Web Environment",
  "Intended Audience :: Developers",
  "Operating System :: POSIX",
  "Programming Language :: Python :: 3",
  "Topic :: Software Development",
]
dependencies = ["httpx>=0.27", "numpy>=1.26", "scikit-learn>=1.4"]

[project.optional-dependencies]
web = ["fastapi>=0.110", "uvicorn[standard]>=0.29"]
dev = ["pytest>=8", "fastapi>=0.110", "uvicorn>=0.29", "ruff>=0.5"]

[project.scripts]
kifu = "kifu.__main__:main"

[project.urls]
Homepage = "https://github.com/gweber/kifu"
Issues = "https://github.com/gweber/kifu/issues"

[tool.setuptools]
packages = ["kifu"]

[tool.setuptools.package-data]
kifu = ["report.html"]

[tool.ruff]
line-length = 120
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP"]
# E741: `l` for a line in short comprehensions; B905: zips over equal-length lists; E731: tiny local helpers.
ignore = ["E501", "B008", "E741", "B905", "E731"]
