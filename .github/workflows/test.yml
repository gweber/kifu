name: test

on:
  push:
  pull_request:

jobs:
  python:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python: ["3.11", "3.12", "3.13"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}
      - run: pip install -e ".[dev]"
      - run: ruff check kifu tests hermes-plugin
      - run: python -m pytest -q tests/

  dashboard:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - run: pip install -e ".[dev]"
      - run: node --check hermes-plugin/dashboard/dist/index.js
      - run: python tests/dump_plugin_fixtures.py /tmp/kifu-fixtures.json
      - run: npm install --no-save react@19 react-dom@19 jsdom@29
      - run: KIFU_FIXTURES=/tmp/kifu-fixtures.json node hermes-plugin/dashboard/render_check.js
